[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyambeo"
version = "0.1.1"
description = "Async client for Sennheiser AMBEO soundbars"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "François AIZPURU" }]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "yarl>=1.9",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
keywords = ["ambeo", "sennheiser", "soundbar", "asyncio", "home-assistant"]

[project.urls]
Homepage = "https://github.com/faizpuru/pyambeo"
Issues = "https://github.com/faizpuru/pyambeo/issues"

[dependency-groups]
dev = [
    "aioresponses",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[tool.uv]
# Dev/test only: aioresponses 0.7.9 does not support aiohttp 3.14 yet.
constraint-dependencies = ["aiohttp<3.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyambeo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "D",   # pydocstyle (PEP 257)
]
ignore = [
    "E501", # line too long, handled by formatter
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["pyambeo"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
